<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/pet.svg" type="image/x-icon">
    <title>Idade de Pet</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="title">Cálculo de idade de pet</div>
            <div class="input">
                <input type="number" name="idadeP" text="Informa a idade do pet" id="idadeP" required="required">
                <span>Informe a idade do pet</span>
            </div>
            <button id="calculate">Calcular</button>
            <div class="result" id="result"></div>
        </div>
    </main>
    <p class="info">Fonte da tabela: AAFP- AAHA/Dog Owner's Home Veterinary Handbook - Zoetis US</p>
    <script src="app.js"></script>    
</body>
</html>
